# ============================================================================
# Res-CoordUNet 皮肤病灶分割 — 默认训练配置
# ============================================================================
# 使用方法:
#   python train.py                          # 使用本文件
#   python train.py --config config/xxx.yaml # 使用自定义配置
# ============================================================================

experiment:
  name: "res_coord_unet_isic2018"
  seed: 42
  output_dir: "./outputs"

# ---------------------------------------------------------------------------
# 模型配置
# ---------------------------------------------------------------------------
model:
  name: "ResCoordUNet"       # 可选: ResCoordUNet (可在 registry 中扩展)
  params:
    in_channels: 3
    num_classes: 1
    bilinear: true
    base_c: 64

# ---------------------------------------------------------------------------
# 数据集配置
# ---------------------------------------------------------------------------
dataset:
  name: "ISIC2018"            # 可选: ISIC2018 (可在 registry 中扩展)
  params:
    img_size: [224, 224]
    val_split: 0.2            # 训练/验证划分比例
  paths:
    train_images: "./dataset/train/images"
    train_masks: "./dataset/train/masks"
  augmentation:
    enabled: true
    flip_prob: 0.5
    rotate_prob: 0.5
    rotate_deg: 15
    brightness_prob: 0.5

# ---------------------------------------------------------------------------
# 训练配置
# ---------------------------------------------------------------------------
training:
  batch_size: 12
  epochs: 200
  num_workers: 8

  loss:
    name: "HybridLoss"        # 可选: DiceLoss, FocalLoss, HybridLoss
    params:
      dice_weight: 0.6
      focal_weight: 0.4
      focal_alpha: 0.25
      focal_gamma: 2.0

  optimizer:
    name: "AdamW"
    params:
      lr: 0.0001
      weight_decay: 0.0001

  scheduler:
    name: "WarmupCosine"
    params:
      warmup_epochs: 5
      min_lr: 0.000001

  amp:
    enabled: true              # 混合精度训练 (仅 GPU 生效)
  # 回调配置 (按需启用/禁用)
  callbacks:
    early_stopping:
      enabled: true
      monitor: "val_dice"
      patience: 20
      mode: "max"

    model_checkpoint:
      enabled: true
      monitor: "val_dice"
      mode: "max"
      save_dir: "./weights"
      save_best_only: true

    visualization:
      enabled: true
      save_path: "./learning_curve.png"

    logging:
      enabled: true
      log_path: "./train_results.json"
